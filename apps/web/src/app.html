<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        var theme = "dark";
        try {
          if (localStorage.getItem("pastille-theme") === "light") theme = "light";
        } catch (e) {}
        document.documentElement.classList.add(theme);
      })();
    </script>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pastille" />
    <link rel="canonical" href="https://pastille.facile.studio/" />
    <meta property="og:url" content="https://pastille.facile.studio/" />
    <meta property="og:title" content="Pastille | Wear your assistant" />
    <meta
      property="og:description"
      content="A 42 mm open hardware charm with Bulle on a round screen. Tap it, talk, and your own Bulle server answers."
    />
    <meta property="og:image" content="https://pastille.facile.studio/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The round Pastille charm with Bulle's face on its screen, beside the line Wear your assistant." />
    <meta name="twitter:card" content="summary_large_image" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
