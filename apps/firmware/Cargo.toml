[package]
name = "pastille-firmware"
version = "0.7.3"
edition = "2021"
rust-version = "1.95"

[dependencies]
embassy-executor = "0.10"
embassy-futures = "0.1"
embassy-sync = "0.8"
embassy-time = "0.5"
embedded-graphics = "0.8"
embedded-tls = { version = "0.19", default-features = false, features = ["p384", "rsa"] }
heapless = { version = "0.8", default-features = false, features = ["serde"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
sha1 = { version = "0.10", default-features = false }

[target.'cfg(not(target_arch = "xtensa"))'.dependencies]
critical-section = { version = "1.2", features = ["std"] }

[target.'cfg(target_arch = "xtensa")'.dependencies]
embedded-hal-bus = "0.3"
embedded-io-async = "0.7"
esp-alloc = "0.11"
esp-backtrace = { version = "0.20", features = ["esp32s3", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32s3"] }
esp-storage = { version = "0.10", features = ["esp32s3", "embedded-storage"] }
embedded-storage = "0.3"
esp-hal = { version = "~1.2.2", features = ["esp32s3", "unstable"] }
esp-println = { version = "0.18", features = ["esp32s3"] }
esp-radio = { version = "=1.0.0-beta.1", features = ["esp32s3", "ble", "wifi", "coex", "unstable", "esp-alloc"] }
esp-rtos = { version = "0.4", features = ["esp32s3", "embassy", "esp-alloc", "esp-radio"] }
embassy-net = { version = "0.9", features = ["dhcpv4", "dns", "medium-ethernet", "proto-ipv4", "tcp", "udp"] }
mipidsi = "0.10"
rand_core = "0.6"
static_cell = "2.1"
trouble-host = { version = "0.7", default-features = false, features = ["central", "peripheral", "gatt", "derive", "security", "default-packet-pool-mtu-255"] }

[[bin]]
name = "pastille-firmware"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
debug = 2

[profile.dev]
opt-level = "s"
