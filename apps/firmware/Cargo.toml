[package]
name = "pastille-firmware"
version = "0.2.0"
edition = "2021"

[dependencies]
embassy-executor = { version = "0.6", features = ["arch-spin"] }
embassy-time = { version = "0.3", features = ["generic-queue-64"] }
embassy-sync = "0.6"
embedded-graphics = "0.8"
embedded-hal = "1.0"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
heapless = { version = "0.8", default-features = false, features = ["serde"] }

[target.'cfg(not(target_arch = "xtensa"))'.dependencies]
critical-section = { version = "1.2", features = ["std"] }

[target.'cfg(target_arch = "xtensa")'.dependencies]
esp-hal = { version = "0.22", features = ["esp32s3"] }
esp-wifi = { version = "0.11", features = ["esp32s3", "wifi"] }

[[bin]]
name = "pastille-firmware"
path = "src/main.rs"
