name: pastille

boards:
  main:
    entry: hardware/index.tsx
    out_dir: dist
    port: 3020
    mcu: esp32-s3

firmware:
  app:
    board: main
    path: apps/firmware
    framework: embassy
    pins_rs: apps/firmware/src/pins.rs
    build_cmd: cargo test

bodies:
  front_bezel: { source: bodies/front_bezel.step, build: bun hardware/bodies/build.ts front_bezel }
  lens: { source: bodies/lens.step, build: bun hardware/bodies/build.ts lens }
  lcd: { source: bodies/lcd.step, build: bun hardware/bodies/build.ts lcd }
  speaker: { source: bodies/speaker.step, build: bun hardware/bodies/build.ts speaker }
  lra: { source: bodies/lra.step, build: bun hardware/bodies/build.ts lra }
  battery: { source: bodies/battery.step, build: bun hardware/bodies/build.ts battery }
  back_shell: { source: bodies/back_shell.step, build: bun hardware/bodies/build.ts back_shell }

assembly:
  out_dir: dist
  format: all
  parts:
    main: { at: [0, 0, 0] }
    front_bezel: { at: [0, 0, 0] }
    lens: { at: [0, 0, 0] }
    lcd: { at: [0, 0, 0] }
    speaker: { at: [0, 0, 0] }
    lra: { at: [0, 0, 0] }
    battery: { at: [0, 0, 0] }
    back_shell: { at: [0, 0, 0] }
