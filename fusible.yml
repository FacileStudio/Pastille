name: pastille

boards:
  main:
    entry: hardware/index.tsx
    out_dir: dist
    port: 3020
    mcu: esp32-s3

firmware:
  app:
    board: main
    path: apps/firmware
    framework: embassy
    pins_rs: apps/firmware/src/pins.rs
    build_cmd: cargo test

bodies:
  pastille_case:
    generate: enclosure
    board: main
    format: all
    out_dir: bodies
    height: 11.5
    wall_thickness: 2.0
    cutouts: true
    mounting: true
