[package]
name = "bohs-switch"
version = "0.1.0"
edition = "2024"

[dependencies]
gpiocdev = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3.5.1", features = ["json"] }

[profile.release]
strip = true
