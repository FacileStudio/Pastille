name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Publish Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Firmware Tests
        working-directory: apps/firmware
        run: cargo test

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Pastille ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            bodies/pastille_case.step
            bodies/pastille_case.stl
            bodies/pastille_case.glb
            bodies/pastille_case.brep
            apps/web/static/models/pastille.glb
            assets/pcb-2d.png
            assets/pcb-3d.png
            assets/schematic.png
