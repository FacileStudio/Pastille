name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Publish Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Match The Tag To Every Version Copy
        run: |
          tag="${GITHUB_REF_NAME#v}"
          web="$(jq -r .version apps/web/package.json)"
          hardware="$(jq -r .version hardware/package.json)"
          cargo="$(grep -m1 '^version = ' apps/firmware/Cargo.toml | cut -d '"' -f2)"
          lock="$(grep -A1 '^name = "pastille-firmware"$' apps/firmware/Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
          status=0
          for pair in "apps/web/package.json=$web" "hardware/package.json=$hardware" \
            "apps/firmware/Cargo.toml=$cargo" "apps/firmware/Cargo.lock=$lock"; do
            if [ "${pair#*=}" != "$tag" ]; then
              echo "::error::${pair%%=*} is '${pair#*=}' but the tag is $tag"
              status=1
            fi
          done
          exit "$status"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Firmware Tests
        working-directory: apps/firmware
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo test --locked

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install Hardware Dependencies
        working-directory: hardware
        run: bun install --frozen-lockfile

      - name: Verify Release Files
        run: bun hardware/fab/verify.ts

      - name: Rebuild Bodies From The Committed Kit
        run: bun hardware/bodies/build.ts

      - name: Fail On Stale Bodies
        run: git diff --exit-code -- bodies && test -z "$(git status --porcelain -- bodies)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Pastille ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            bodies/front_bezel.step
            bodies/front_bezel.stl
            bodies/lens.step
            bodies/lens.stl
            bodies/back_shell.step
            bodies/back_shell.stl
            dist/fab/gerbers.zip
            dist/fab/bom.csv
            dist/fab/cpl.csv
            dist/cad/board.step
            dist/cad/kicad.zip
            apps/web/static/models/pastille.glb
            apps/web/static/models/pastille_assembly.glb
            assets/pcb-2d.png
            assets/pcb-3d.png
            assets/schematic.png
