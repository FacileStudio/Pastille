name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Publish Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Firmware Tests
        working-directory: apps/firmware
        run: cargo test

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Hardware Dependencies
        working-directory: hardware
        run: bun install --frozen-lockfile

      - name: Verify Release Files
        run: bun hardware/fab/verify.ts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Pastille ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            bodies/front_bezel.step
            bodies/front_bezel.stl
            bodies/lens.step
            bodies/lens.stl
            bodies/back_shell.step
            bodies/back_shell.stl
            dist/fab/gerbers.zip
            dist/fab/bom.csv
            dist/fab/cpl.csv
            dist/cad/board.step
            dist/cad/kicad.zip
            apps/web/static/models/pastille.glb
            apps/web/static/models/pastille_assembly.glb
            assets/pcb-2d.png
            assets/pcb-3d.png
            assets/schematic.png
