name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  firmware-tests:
    name: Embassy Firmware Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/firmware

      - name: Test Firmware Protocol & Avatar
        working-directory: apps/firmware
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo test

      - name: Run Clippy
        working-directory: apps/firmware
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo clippy --all-targets -- -D warnings

  hardware-files:
    name: Hardware Release Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Hardware Dependencies
        working-directory: hardware
        run: bun install --frozen-lockfile

      - name: Verify Release Files And Gerbers
        run: bun hardware/fab/verify.ts

      - name: Rebuild Bodies From The Committed Kit
        run: bun hardware/bodies/build.ts

      - name: Fail On Stale Bodies
        run: git diff -I "CARTESIAN_POINT" --exit-code -- bodies/*.step

  hardware-and-web:
    name: Hardware & Web Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Hardware Dependencies
        working-directory: hardware
        run: bun install --frozen-lockfile

      - name: Typecheck TSX Circuit
        working-directory: hardware
        run: bun run typecheck

      - name: Install Web Dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Check & Build Web App
        working-directory: apps/web
        run: bun run check && bun run build
